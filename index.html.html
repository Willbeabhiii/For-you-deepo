<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Proposal 💖</title>

<style>
    body {
        font-family: 'Comic Sans MS', cursive;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    img {
        width: 200px;
        height: auto;
        border-radius: 15px;
        margin-bottom: 20px;
    }

    h1 {
        color: #ff4d6d;
        font-size: 24px;
        margin-bottom: 25px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    button {
        padding: 12px 25px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    #yesBtn {
        background-color: #4CAF50;
        color: white;
    }

    #noBtn {
        background-color: #ff4d6d;
        color: white;
    }
</style>
</head>

<body>

<div class="container">
    <img id="mainImage" src="https://uploads.onecompiler.io/44d34728k/44d32cqy9/img2.png.png" alt="Cute Image">
    
    <h1 id="message">
       To My Deepodi💖 Deepo… you make my heart feel at home. Will you be my Valentine? 💖
    </h1>

    <div class="buttons">
        <button id="yesBtn" onclick="yesClicked()">Yes 💕</button>
        <button id="noBtn" onclick="noClicked()">No 😢</button>
    </div>
</div>

<script>
    let noClickCount = 0;

    const noTexts = [
        "Are you sure? 🥺",
        "Don't you love me? 💔",
        "Think again, my love 😭",
        "Please Deepika 🥹",
        "Last chance 😢💖",
        "Wait… really? 🥺",
        "My heart can’t take this 💔",
        "Say yes and save me 😭",
        "You’re breaking my heart, Deepo 💖",
        "Just one smile and I’m yours 🥹",
        "Don’t do this to me 😢",
        "I’ll wait forever for you 💞",
        "Are you playing with my heart? 🥺",
        "Think about us 😭💫",
        "My heart says yes already 💓",
        "Please don’t say no 🥹",
        "I believe in us 💖",
        "You’re my favorite person 😢",
        "One chance, my love 💕",
        "My heart is knocking 🚪💓",
        "Don’t leave me hanging 😭",
        "You know I adore you 🥺",
        "Say yes and make me smile 😊💖",
        "I’m already yours 😢",
        "My heart chose you 💞",
        "Please don’t break my dream 🥹",
        "You’re my sunshine 🌸💖",
        "I can’t imagine anyone else 😭",
        "Give my heart a hug 🫶",
        "I’m asking with all my heart 💓",
        "Just feel it once 🥺",
        "You matter to me so much 💖",
        "Don’t let this be a no 😢",
        "I’m right here, waiting 💞",
        "You make my heart race 🥹",
        "Think of all the smiles 😭😊",
        "My heart whispers your name 💓",
        "Please choose us 💖",
        "I promise to cherish you 🫶",
        "Don’t make me cry 😢",
        "You’re my soft spot 🥺",
        "I’m already smiling at the thought 💞",
        "Say yes and make my day 🌸",
        "I’m holding my breath 😭",
        "My heart is hopeful 💖",
        "Just one yes 🥹",
        "I can’t stop loving you 💓",
        "Please don’t walk away 😢",
        "You’re special to me 💞",
        "My heart is all yours 🥺",
        "Say yes, my favorite human 💖",
        "I believe in this 😭✨",
        "Don’t leave my heart unanswered 💓",
        "You mean more than you know 🥹",
        "Last last chance 😢💖"
    ];

    const images = [
        "https://uploads.onecompiler.io/44d34728k/44d3496gm/IMG_4026.png",
        "https://uploads.onecompiler.io/44d34728k/44d3496gm/IMG_1232.png",
        "https://uploads.onecompiler.io/44d34728k/44d3496gm/IMG_2063.png",
        "https://uploads.onecompiler.io/44d34728k/44d3496gm/IMG_2234.png",
        "https://uploads.onecompiler.io/44d34728k/44d3496gm/IMG_2026.png",
        "https://uploads.onecompiler.io/44d34728k/44d3496gm/IMG_1294.png",
        "https://uploads.onecompiler.io/44d34728k/44d3496gm/IMG_1459.png",
        "https://uploads.onecompiler.io/44d34728k/44d3496gm/IMG_1283.png",
        "https://uploads.onecompiler.io/44d34728k/44d3496gm/IMG_1247.png",
    ];

    function noClicked() {
        noClickCount++;

        let yesBtn = document.getElementById("yesBtn");
        let currentSize = 18 + noClickCount * 6;
        yesBtn.style.fontSize = currentSize + "px";
        yesBtn.style.padding = (12 + noClickCount * 4) + "px " + (25 + noClickCount * 6) + "px";

        let noBtn = document.getElementById("noBtn");
        if (noClickCount <= noTexts.length) {
            noBtn.innerText = noTexts[noClickCount - 1];
        }

        let img = document.getElementById("mainImage");
        if (noClickCount <= images.length) {
            img.src = images[noClickCount - 1];
        }
    }

    function yesClicked() {
        document.querySelector(".container").innerHTML = `
            <img src="https://uploads.onecompiler.io/44d34728k/44d32cqy9/img2.png.png" style="width:220px;border-radius:15px;">
            <h1 style="color:#ff4d6d;">
                I knew you would say YES 💖<br><br>
                I love you so much, Deepo😘
            </h1>
        `;
    }
</script>

</body>
</html>
